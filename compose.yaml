version: '3.7'

networks:
  my_custom_network:
    driver: bridge

services:
  build_db:
    container_name: build-db
    image: nettahalamish/cyber-project-grade-11:latest
    build:
      context: .
    networks:
      - my_custom_network
    volumes:
      - ./DATABASE_GAME.db:/app/database/DATABASE_GAME.db
    command: ["python", "createDatabase.py"]
    restart: on-failure

  load_balancer:
    container_name: load-balancer
    image: nettahalamish/cyber-project-grade-11:latest
    build:
      context: .
    networks:
      - my_custom_network
    volumes:
      - ./DATABASE_GAME2.db:/app/database/DATABASE_GAME2.db
    depends_on:
      - build_db
    ports:
      # Expose ports 5000–6000 for both UDP and TCP
      - "5000-6000:5000-6000/udp"
      - "5000-6000:5000-6000/tcp"
    command: ["python", "lb/mainServerV2.py"]
    restart: always

  server_flask:
    container_name: server-flask
    image: nettahalamish/cyber-project-grade-11:latest
    build:
      context: .
    networks:
      - my_custom_network
    volumes:
      - ./DATABASE_GAME.db:/app/database/DATABASE_GAME.db
    depends_on:
      - build_db
      - load_balancer
    ports:
      # Expose the same dynamic range for Flask (UDP & TCP)
      - "5000-6000:5000-6000/udp"
      - "5000-6000:5000-6000/tcp"
    command: ["python", "server/srever.py"]
    restart: always

  server_chat:
    container_name: server-chat
    image: nettahalamish/cyber-project-grade-11:latest
    build:
      context: .
    networks:
      - my_custom_network
    depends_on:
      - server_flask
    ports:
      # Expose ports 5000–6000 (UDP & TCP) if needed by chat service
      - "5000-6000:5000-6000/udp"
      - "5000-6000:5000-6000/tcp"
    command: ["python", "chatCervice1.py"]
    restart: always
