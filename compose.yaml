#      restart: always

    server_chat:
      network_mode: "host"
      container_name: "server-chat"
      image: nettahalamish/cyber-project-grade-11:latest
      build:
        context: .
      ports:
        - "5005:5005"
      depends_on:
        - server_flask
      command: ["python", "chatCervice1.py"]
      restart: always
