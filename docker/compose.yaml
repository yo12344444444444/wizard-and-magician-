services:
  main_server:
    container_name: "main-server"
    build:
      context: ./
    ports:
      - "8821:8821"
      - "8823:8823"
      - "8824:8824"
      - "8825:8825"
      - "8826:8826"
    volumes:
      - ./app/DATABASE_GAME.db:/app/database.db
      - ./app/logs:/app/logs
    depends_on:
      - db
    restart: always

  second_server_1:
    container_name: "second server 1"
    build:
      context: ./
    ports:
      - "8822:8822"
    depends_on:
      - main_server
    volumes:
      - ./app/DATABASE_GAME.db:/app/database.db
      - ./app/logs:/app/logs
    command:
      - python oneSecondServer.py
    restart: always

  second_server_2:
    container_name: "second server 2"
    build:
      context: ./
    ports:
      - "8824:8824"
    depends_on:
      - main_server
    volumes:
      - ./app/DATABASE_GAME.db:/app/database.db
      - ./app/logs:/app/logs
    command:
      - python oneSecondServer.py
    restart: always

  db:
    container_name: "data base"
    image: mcp/sqlite:latest
    volumes:
      - ./app/DATABASE_GAME.db:/app/database.db  # Mount the DB to persist data
    command: tail -f /dev/null  # Keep the container running
    restart: always


