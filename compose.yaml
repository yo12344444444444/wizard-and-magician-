services:
  main_server:
    container_name: "main-server"
    build:
      context: .
    image: nettahalamish/cyber-project-grade-11:latest
    command: ["python", "MainServer.py"]
    ports:
#      - "8820:8820"
#      - "8821:8821"
      - "8823:8823"
      - "8824:8824"
#      - "8825:8825"
#      - "8826:8826"
    volumes:
      - ./app/DATABASE_GAME.db:/app/database.db
    environment:
      - SECOND_SERVER_1=http://second-server-1:8820
      - SECOND_SERVER_2=http://second-server-2:8821
      - SERVER_3=http://server3:8825
      - SERVER_4=http://server4:8826
    restart: always

  second_server_1:
    container_name: "second-server-1"
    build:
      context: .
    image: nettahalamish/cyber-project-grade-11:latest
    ports:
      - "8820:8820"
    depends_on:
      - main_server
    volumes:
      - ./app/DATABASE_GAME.db:/app/database.db
    command: ["python", "SecondServer.py"]
    restart: always

  second_server_2:
    container_name: "second-server-2"
    build:
      context: .
    image: nettahalamish/cyber-project-grade-11:latest
    ports:
      - "8821:8821"
    depends_on:
      - main_server
    volumes:
      - ./app/DATABASE_GAME.db:/app/database.db
    command: ["python", "oneSecondServer.py"]
    restart: always

  server_3:
    container_name: "server-3"
    build:
      context: .
    image: nettahalamish/cyber-project-grade-11:latest
    ports:
      - "8825:8825"
    depends_on:
      - main_server
    volumes:
      - ./app/DATABASE_GAME.db:/app/database.db
    command: [ "python", "Server3.py" ]
    restart: always

  server_4:
    container_name: "server-4"
    build:
      context: .
    image: nettahalamish/cyber-project-grade-11:latest
    ports:
      - "8826:8826"
    depends_on:
      - main_server
    volumes:
      - ./app/DATABASE_GAME.db:/app/database.db
    command: [ "python", "Server4.py" ]
    restart: always
