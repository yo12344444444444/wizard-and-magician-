services:
    build_db:
      network_mode: "host"
      container_name: "build-db"
      image: nettahalamish/cyber-project-grade-11:latest
      build:
        context: .
      volumes:
        - ./DATABASE_GAME.db:/app/database/DATABASE_GAME.db
      command: [ "python", "createDatabase.py" ]
      restart: on-failure

    load_balancer:
      network_mode: "host"
      container_name: "load-balancer"
      image: nettahalamish/cyber-project-grade-11:latest
      build:
        context: .
      volumes:
        - ./DATABASE_GAME2.db:/app/database/DATABASE_GAME2.db
      depends_on:
        - build_db
      command: ["python", "lb/mainServerV2.py"]
      restart: always

    server_flask:
      network_mode: "host"
      container_name: "server-flask"
      image: nettahalamish/cyber-project-grade-11:latest
      build:
        context: .
      volumes:
        - ./DATABASE_GAME.db:/app/database/DATABASE_GAME.db
      depends_on:
        - build_db
        - load_balancer
      command: ["python", "server/srever.py" ]
      restart: always

